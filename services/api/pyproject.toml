[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-api"
version = "0.1.0"
description = "Cycle Companion backend: WhatsApp bot webhook, voice transcription, log extraction and the cycle record API."
requires-python = ">=3.11"
dependencies = [
  "cycle-engine",          # install packages/cycle_engine first (see README)
  "cryptography>=42",
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
