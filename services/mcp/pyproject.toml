[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-mcp"
version = "0.1.0"
description = "Cycle Companion MCP connector: lets Claude, ChatGPT and other MCP clients read a user's cycle summary with her consent."
requires-python = ">=3.11"
dependencies = [
  "cycle-engine",   # install packages/cycle_engine first
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
companion-mcp = "companion_mcp.server:main"

[tool.setuptools.packages.find]
include = ["companion_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
