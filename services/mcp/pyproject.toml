[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ritu-mcp"
version = "0.1.0"
description = "Ritu MCP connector: lets Claude, ChatGPT and other MCP clients read a user's cycle summary with her consent."
requires-python = ">=3.11"
dependencies = [
  "ritu-engine",   # install packages/cycle_engine first
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ritu-mcp = "ritu_mcp.server:main"

[tool.setuptools.packages.find]
include = ["ritu_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
