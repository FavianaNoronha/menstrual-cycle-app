name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repo keeps only lib/, pubspec and tests; generate the Android shell here.
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name companion_mobile --org in.cyclecompanion .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug-signed release APK (for testing, not for Play Store)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-companion-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
