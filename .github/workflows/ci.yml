name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/cycle_engine, services/api, services/mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e "packages/cycle_engine[dev]"
          pip install -e "${{ matrix.package }}[dev]"
      - name: Test
        run: pytest -q ${{ matrix.package }}

  mobile:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
