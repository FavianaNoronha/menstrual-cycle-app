[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ritu-engine"
version = "0.1.0"
description = "Cycle engine for Ritu: prediction, clinical norms, PBAC flow scoring, DRSP mood cyclicity, pain guidance and red-flag rules."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
